<!DOCTYPE html>
<html>
<head>
    <title>Notifications</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .box {
            width: 70%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .note {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .unread {
            background: #e7f1ff;
            border-left: 5px solid #0d6efd;
        }

        .read {
            background: #f8f9fa;
            color: #6c757d;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="box">

    <!-- 🔔 HEADER -->
    <div class="top-bar">
        <h3>🔔 Notifications</h3>

        <div>
            <a href="{% url 'staff_dashboard' %}" class="btn btn-primary btn-sm">
                ⬅ Back
            </a>

            <a href="{% url 'notifications' %}?mark=all" class="btn btn-success btn-sm">
                Mark all as read
            </a>
        </div>
    </div>

    <!-- 📩 LIST -->
    {% if notes %}
        {% for n in notes %}
            <div class="note {% if not n.is_read %}unread{% else %}read{% endif %}">
                <strong>{{ n.message }}</strong>
                <br>
                <small>{{ n.created_at }}</small>
            </div>
        {% endfor %}
    {% else %}
        <div class="alert alert-info text-center">
            No notifications available
        </div>
    {% endif %}

</div>

</body>
</html>
