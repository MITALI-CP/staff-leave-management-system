<!DOCTYPE html>
<html>
<head>
    <title>Leave Calendar</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: Arial;
        }

        .calendar-box {
            width: 90%;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .fc-event {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="calendar-box">
    <h2 class="text-center">📅 Leave Calendar</h2>

    <div id="calendar"></div>

    <br>
    <div class="text-center">
        <a href="{% url 'admin_dashboard' %}" class="btn btn-primary">⬅ Back</a>
    </div>
</div>

<!-- 🔥 MODAL -->
<div class="modal fade" id="leaveModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Leave Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="modalBody"></div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {

        initialView: 'dayGridMonth',
        height: 600,

        events: {
            url: window.location.href,
            method: 'GET'
        },

        // 🎨 COLOR BASED ON STATUS
        eventDidMount: function(info) {
            const status = info.event.extendedProps.status;

            if (status === "Approved") {
                info.el.style.backgroundColor = "#198754";
            } else if (status === "Rejected") {
                info.el.style.backgroundColor = "#dc3545";
            } else if (status === "Pending") {
                info.el.style.backgroundColor = "#ffc107";
                info.el.style.color = "black";
            } else if (status === "Cancelled") {
                info.el.style.backgroundColor = "#6c757d";
            }
        },

        // ✅ CLICK EVENT (ADVANCED)
        eventClick: function(info) {

            let title = info.event.title;
            let start = info.event.startStr;
            let end = info.event.endStr || start;

            let status = info.event.extendedProps.status || "N/A";
            let reason = info.event.extendedProps.reason || "Not provided";

            document.getElementById("modalBody").innerHTML = `
                <p><strong>User:</strong> ${title}</p>
                <p><strong>Status:</strong> ${status}</p>
                <p><strong>Start Date:</strong> ${start}</p>
                <p><strong>End Date:</strong> ${end}</p>
                <p><strong>Reason:</strong> ${reason}</p>
            `;

            let modal = new bootstrap.Modal(document.getElementById('leaveModal'));
            modal.show();
        }

    });

    calendar.render();
});
</script>

</body>
</html>
