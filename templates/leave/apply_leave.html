<!DOCTYPE html>
<html>
<head>
    <title>Apply Leave</title>

    <!-- Bootstrap (for better UI) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .box {
            width: 420px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #5a67d8;
        }

        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            color: #667eea;
        }

        a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-align: center;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Apply Leave</h2>

    <!-- ✅ MESSAGE DISPLAY -->
    {% if messages %}
        {% for message in messages %}
            <div class="message {% if message.tags == 'success' %}success{% else %}error{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <!-- Leave Type -->
        <label>Leave Type</label>
        <select name="leave_type" required>
            <option value="">Select</option>
            <option value="Casual">Casual Leave</option>
            <option value="Sick">Sick Leave</option>
            <option value="Emergency">Emergency Leave</option>
        </select>

        <!-- Start Date -->
        <label>Start Date</label>
        <input type="date" name="start_date" required>

        <!-- End Date -->
        <label>End Date</label>
        <input type="date" name="end_date" required>

        <!-- Reason -->
        <label>Reason</label>
        <textarea name="reason" rows="3" required></textarea>

        <button type="submit">Submit Leave</button>
    </form>

    <a href="/leave/my-leaves/">View My Leaves</a>
</div>

</body>
</html>
